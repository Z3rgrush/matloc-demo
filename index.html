<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MATLOC Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Demo of the Macmillan Ad Toolkit: an approval-gated advertising agent for book imprints across Meta, Google, TikTok and Amazon Ads.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="shell">
  <aside class="rail">
    <div class="brand"><div class="brand-mark" aria-hidden="true"></div><div><b>MATLOC</b><span>Macmillan Ad Toolkit<br>Launch · Optimize · Convert</span></div></div>
    <nav class="nav" id="nav" aria-label="Workspaces"></nav>
    <div class="rail-foot">
      <span class="demo-flag">Demo build · fictional titles and data</span>
      <span>Agents: Planner, Builder, Budget steward, Monitor, Optimizer, Reporter, Platform watcher</span>
    </div>
  </aside>
  <div class="main">
    <header class="bar">
      <div class="clock" data-tour="clock"><span class="muted small">Today</span><span class="num" id="clock"></span></div>
      <button class="btn sm" data-act="advance" data-tour="advance" title="Run one simulated day: pull spend, check pacing, draft proposals">Advance one day</button>
      <span class="pill alert" id="kill" hidden>Kill switch on</span>
      <span class="spacer"></span>
      <label class="role" for="role" data-tour="role">Acting as
        <select id="role">
          <option value="imprint_marketer">Imprint marketer</option>
          <option value="marketing_director">Marketing director</option>
          <option value="compliance">Compliance reviewer</option>
          <option value="admin">Central paid media admin</option>
        </select>
      </label>
      <button class="btn sm primary" id="tour-start" data-tour="tour-btn">Guided tour</button>
      <button class="btn sm ghost" id="reset" title="Reset all demo data">Reset</button>
    </header>
    <main class="view" id="view" tabindex="-1"></main>
  </div>
</div>
<script src="js/data.js"></script>
<script src="js/engine.js"></script>
<script src="js/charts.js"></script>
<script src="js/app.js"></script>
<script src="js/tour.js"></script>
</body>
</html>
